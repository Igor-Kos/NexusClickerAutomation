<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nexus Clicker</title>
  <style>
    body { font: 16px/1.5 system-ui, "Segoe UI", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #202124; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #e8eaed; background: #202124; } }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    button { font: inherit; padding: 10px 20px; margin: 8px 0 20px; cursor: pointer; }
    #done { display: none; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Nexus Clicker</h1>
  <p>To click Slow download, the extension needs access to mod pages on nexusmods.com.</p>
  <p lang="ru">Чтобы нажимать Slow download, расширению нужен доступ к страницам модов на nexusmods.com.</p>
  <button id="allow" type="button">Allow / Разрешить</button>
  <p id="done">Done. You can close this tab. / Готово. Эту вкладку можно закрыть.</p>
  <script src="setup.js"></script>
</body>
</html>
